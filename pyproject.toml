[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luwiai-v1"
version = "0.1.0"
description = "Research starter for training an agent-oriented language model from documented project-created data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["luwiai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
